name: Sync tool and domain counts

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-tool-count.mjs"
      - ".github/workflows/sync-tool-count.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Update tool count from live catalog
        run: node scripts/update-tool-count.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Stage everything the script touches. This was previously
            # "git add README.md package.json", which is half the reason
            # smithery.yaml, glama.json and server.json drifted: even when the
            # counts were recomputed, the manifests the directories actually
            # read were never committed.
            git add -A
            git commit -m "chore: sync tool and domain counts from live catalog"
            git push
          else
            echo "No changes."
          fi
