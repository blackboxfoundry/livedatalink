name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry
# (https://registry.modelcontextprotocol.io) using GitHub OIDC — no interactive
# login and no stored secret. OIDC proves this workflow runs in a repo under the
# github.com/blackboxfoundry org, which authorizes the
# `io.github.blackboxfoundry/*` namespace.
#
# Triggers: on any push to main that changes server.json (so a version bump
# auto-publishes), and manually via the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.json"

permissions:
  contents: read
  id-token: write # required for github-oidc auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to registry
        run: ./mcp-publisher publish server.json
