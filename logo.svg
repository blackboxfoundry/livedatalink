<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1c1c20"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="60" fill="url(#bgGrad)"/>

  <!-- Subtle border -->
  <rect x="2" y="2" width="396" height="396" rx="58" fill="none" stroke="#2e2e35" stroke-width="2"/>

  <!-- Lightning bolt -->
  <g filter="url(#glow)">
    <path d="M225 70 L130 215 L195 215 L175 330 L270 185 L205 185 Z"
          fill="url(#boltGrad)"
          stroke="#10b981"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="370"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="32"
        font-weight="800"
        fill="#f4f4f5"
        text-anchor="middle"
        letter-spacing="-0.02em">
    Live<tspan fill="#10b981">Data</tspan>Link
  </text>
</svg>
