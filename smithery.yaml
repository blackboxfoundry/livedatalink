runtime: "remote"
name: "livedatalink"
displayName: "LiveDataLink"
description: "88 real-time data tools across 18 domains for AI agents. Stocks, options, crypto, FMCSA, sanctions, federal courts, weather, vehicles, cyber (CVE/CWE/EPSS/KEV), college metrics, FEMA disasters, property, EIA energy, FRED Federal Reserve macroeconomics, SEC EDGAR filings, NREL renewable energy. One endpoint, one API Key. Free tier."
homepage: "https://livedatalink.ai"
icon: "https://livedatalink.ai/logo.png"
remote:
  type: "streamable-http"
  url: "https://livedatalink.ai/mcp"
configSchema:
  type: "object"
  required:
    - "apiKey"
  properties:
    apiKey:
      type: "string"
      title: "API Key"
      description: "Your LiveDataLink API Key. Get a free one at https://livedatalink.ai/signup/free or subscribe for higher limits."
exampleConfig:
  apiKey: "<your_livedatalink_api_key>"
