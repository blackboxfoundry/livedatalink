runtime: "remote"
name: "livedatalink"
displayName: "LiveDataLink"
description: "62 real-time data tools across 14 domains for AI agents. Stocks, crypto, FMCSA, sanctions, courts, weather, vehicles, cyber, college, FEMA disasters, property. One endpoint, one API Key. Free tier."
homepage: "https://livedatalink.ai"
icon: "https://livedatalink.ai/logo.png"
remote:
  type: "streamable-http"
  url: "https://livedatalink.ai/mcp"
configSchema:
  type: "object"
  required:
    - "apiKey"
  properties:
    apiKey:
      type: "string"
      title: "API Key"
      description: "Your LiveDataLink API Key. Get a free one at https://livedatalink.ai/signup/free or subscribe for higher limits."
exampleConfig:
  apiKey: "<your_livedatalink_api_key>"
