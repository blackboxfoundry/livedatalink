runtime: "remote"
name: "livedatalink"
displayName: "LiveDataLink"
description: "243 real-time data tools across 53 domains for AI agents. Sanctions screening (OFAC/UN/EU/BIS first-party), SEC EDGAR, federal courts plus Caselaw Access Project, IRS nonprofits, NPPES healthcare providers, USAspending federal awards, Federal Register + eCFR, CVE + threat intel (RDAP, IP reputation, FBI Wanted), FRED + BLS + US Treasury + World Bank macro, EIA + NREL energy, Zillow ZHVI/ZORI real estate, TX parcels, FDA, EPA, FEC, FMCSA, USPTO patents, Census, federal recreation (RIDB), books and scholarly, geocoding, federal grants, CPSC product-safety, NPM/PyPI/cargo/GitHub supply-chain intel, and more. One bearer token, one endpoint, one bill. Free tier."
homepage: "https://livedatalink.ai"
icon: "https://livedatalink.ai/logo.png"
remote:
  type: "streamable-http"
  url: "https://livedatalink.ai/mcp"
configSchema:
  type: "object"
  required:
    - "apiKey"
  properties:
    apiKey:
      type: "string"
      title: "API Key"
      description: "Your LiveDataLink API Key. Get a free one at https://livedatalink.ai/signup/free or subscribe for higher limits."
exampleConfig:
  apiKey: "<your_livedatalink_api_key>"
